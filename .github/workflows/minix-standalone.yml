name: MINIX standalone filesystem qualification
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  minix-real-media:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Compile and test the freestanding MINIX.so
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ifs-minix-qualification
          src=native/filesystems/minix/module
          flags="-std=c11 -O2 -Wall -Wextra -Wpedantic -Wshadow -Werror"
          cc $flags -fPIC -fno-builtin -fno-stack-protector \
            -ffreestanding -fvisibility=hidden -nostdlib -shared \
            -Wl,-z,defs -Wl,-z,relro -Wl,-z,now \
            -I "$src" "$src/minix_module.c" \
            -o /tmp/ifs-minix-qualification/MINIX.so
          cc $flags -I "$src" \
            tests/minix_dropin_module_test.c "$src/minix_module.c" \
            -o /tmp/ifs-minix-qualification/minix-test
          /tmp/ifs-minix-qualification/minix-test
          file=/tmp/ifs-minix-qualification/MINIX.so
          readelf -h "$file" | grep -Eq 'Type:.*DYN'
          readelf -Ws "$file" | grep -F 'infiltrator_filesystem_module_v1' >/dev/null
          readelf -p .ifsmeta "$file" | grep -F 'IFS-MODULE:minix:1' >/dev/null
          if readelf -d "$file" | grep -Eq '[(]NEEDED[)]'; then
            echo "MINIX.so has a forbidden runtime shared-library dependency" >&2
            exit 1
          fi
          bash -n packaging/linux/minix-module-helper.sh
      - name: Qualify five independently formatted MINIX media variants
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends util-linux
          command -v mkfs.minix
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Wshadow -Werror \
            -I native/filesystems/minix/module \
            tests/minix_real_mkfs_test.c \
            native/filesystems/minix/module/minix_module.c \
            -o /tmp/ifs-minix-qualification/minix-real
          for variant in 1:14 1:30 2:14 2:30 3:60; do
            IFS=: read -r version names <<< "$variant"
            image=$(mktemp /tmp/ifs-minix-XXXXXXXX.img)
            trap 'rm -f -- "$image"' EXIT
            truncate -s 8M "$image"
            if [[ "$version" == 3 ]]; then
              mkfs.minix -3 "$image" >/dev/null
            else
              mkfs.minix "-$version" -n "$names" "$image" >/dev/null
            fi
            /tmp/ifs-minix-qualification/minix-real "$image" "$version" "$names"
            rm -f -- "$image"
            trap - EXIT
          done
          echo MINIX-V1-V2-V3-INDEPENDENT-IMAGE-QUALIFICATION-PASSED
