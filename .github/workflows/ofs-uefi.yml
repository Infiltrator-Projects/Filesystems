name: OFS UEFI standalone driver
on:
  push:
    branches: [main]
    paths:
      - 'VERSION'
      - 'native/filesystems/ofs/efi/**'
      - 'native/filesystems/ofs/core/**'
      - 'tests/ofs_efi_reader_test.c'
      - 'tests/ofs_efi_media_probe.c'
      - 'tests/ofs_efi_error_contract.py'
      - 'tests/ofs_uefi_vm_probe.c'
      - 'tests/ofs_uefi_vm_fixture.py'
      - 'scripts/build-ofs-efi.sh'
      - 'scripts/build-ofs-uefi-vm-probe.sh'
      - 'scripts/test-ofs-uefi-ovmf.sh'
      - 'scripts/gnu-efi-toolchain.sh'
      - '.github/workflows/ofs-uefi.yml'
  pull_request:
    paths:
      - 'VERSION'
      - 'native/filesystems/ofs/efi/**'
      - 'native/filesystems/ofs/core/**'
      - 'tests/ofs_efi_reader_test.c'
      - 'tests/ofs_efi_media_probe.c'
      - 'tests/ofs_efi_error_contract.py'
      - 'tests/ofs_uefi_vm_probe.c'
      - 'tests/ofs_uefi_vm_fixture.py'
      - 'scripts/build-ofs-efi.sh'
      - 'scripts/build-ofs-uefi-vm-probe.sh'
      - 'scripts/test-ofs-uefi-ovmf.sh'
      - 'scripts/gnu-efi-toolchain.sh'
      - '.github/workflows/ofs-uefi.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Install EFI compiler and binutils
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gnu-efi gcc binutils file qemu-system-x86 ovmf dosfstools mtools gdisk
      - name: Compile independent OFS firmware driver
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/build-ofs-efi.sh
          bash scripts/build-ofs-efi.sh dist-ofs-efi
          file dist-ofs-efi/OFS_x64.efi
          test -s dist-ofs-efi/OFS_x64.efi
      - name: Test bounded OFS firmware reader with corrupt hash chains
        shell: bash
        run: |
          set -euo pipefail
          cc -std=c11 -O2 -Wall -Wextra -Werror \
            tests/ofs_efi_reader_test.c \
            native/filesystems/ofs/efi/reader.c \
            native/filesystems/ofs/core/ofs_core.c \
            native/filesystems/ofs/core/ofs_primitives.c \
            -o "$RUNNER_TEMP/ofs-efi-reader-test"
          "$RUNNER_TEMP/ofs-efi-reader-test"
      - name: Confirm EFI transport and metadata errors remain distinct
        shell: bash
        run: python3 tests/ofs_efi_error_contract.py
      - name: Qualify read-only physical-media probe against canonical reader
        shell: bash
        run: |
          set -euo pipefail
          cc -std=c11 -O2 -Wall -Wextra -Werror \
            tests/ofs_efi_media_probe.c \
            native/filesystems/ofs/efi/reader.c \
            native/filesystems/ofs/core/ofs_core.c \
            native/filesystems/ofs/core/ofs_primitives.c \
            -o "$RUNNER_TEMP/ofs-efi-media-probe"
          python3 tests/ofs_uefi_vm_fixture.py "$RUNNER_TEMP/ofs-probe-good.img"
          "$RUNNER_TEMP/ofs-efi-media-probe" "$RUNNER_TEMP/ofs-probe-good.img"
          python3 tests/ofs_uefi_vm_fixture.py "$RUNNER_TEMP/ofs-probe-bad.img" --alien
          if "$RUNNER_TEMP/ofs-efi-media-probe" "$RUNNER_TEMP/ofs-probe-bad.img"; then
            echo "Non-OFS media was wrongly accepted" >&2
            exit 1
          fi
      - name: Test actual EFI binding, file access and non-OFS rejection under OVMF
        shell: bash
        run: |
          set -euo pipefail
          OFS_EFI_TRACE=1 bash scripts/build-ofs-efi.sh dist-ofs-efi-diagnostic
          bash scripts/test-ofs-uefi-ovmf.sh \
            dist-ofs-efi-diagnostic/OFS_x64.efi \
            "$RUNNER_TEMP/ofs-qemu/diagnostic" diagnostic
          bash scripts/test-ofs-uefi-ovmf.sh \
            dist-ofs-efi/OFS_x64.efi \
            "$RUNNER_TEMP/ofs-qemu/production" production
      - name: Store OVMF stage logs, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ofs-ovmf-serial
          path: ${{ runner.temp }}/ofs-qemu/**/serial.log
          retention-days: 30
          if-no-files-found: warn
      - name: Store OFS firmware artifact for controlled qualification
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ofs-uefi-experimental
          path: dist-ofs-efi/OFS_x64.efi
          retention-days: 30
          if-no-files-found: error
