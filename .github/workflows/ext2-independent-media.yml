name: EXT2 independent SO media qualification
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ext2-independent-media.yml'
      - 'native/filesystems/ext2/core/**'
      - 'native/filesystems/ext2/module/**'
      - 'tests/ext2_*'
      - 'tests/independent_image_io.h'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ext2-real-media:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Install independent EXT2 tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential binutils e2fsprogs
      - name: Compile the actual freestanding EXT2.so and exercise unit fixtures
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ifs-ext2-ci
          flags="-std=c11 -O2 -Wall -Wextra -Wpedantic -Wshadow -Werror"
          src=native/filesystems/ext2
          cc $flags -fPIC -fno-builtin -fno-stack-protector -ffreestanding -fvisibility=hidden -nostdlib -shared -Wl,-z,defs -Wl,-z,relro -Wl,-z,now \
            -I "$src/module" -I "$src/core" \
            "$src/module/ext2_module.c" "$src/core/ext2_core.c" "$src/core/ext2_engine.c" \
            -o /tmp/ifs-ext2-ci/EXT2.so
          cc $flags -I "$src/module" -I "$src/core" \
            tests/ext2_dropin_module_test.c \
            "$src/module/ext2_module.c" "$src/core/ext2_core.c" "$src/core/ext2_engine.c" \
            -o /tmp/ifs-ext2-ci/ext2-test
          /tmp/ifs-ext2-ci/ext2-test
          readelf -h /tmp/ifs-ext2-ci/EXT2.so | grep -Eq 'Type:.*DYN'
          readelf -Ws /tmp/ifs-ext2-ci/EXT2.so | grep -F 'infiltrator_filesystem_module_v1'
          readelf -p .ifsmeta /tmp/ifs-ext2-ci/EXT2.so | grep -F 'IFS-MODULE:ext2:1'
          ! readelf -d /tmp/ifs-ext2-ci/EXT2.so | grep -Eq '[(]NEEDED[)]'
      - name: Independently format, write, flush, reread and check EXT2 media
        shell: bash
        run: |
          set -euo pipefail
          flags="-std=c11 -O2 -Wall -Wextra -Wpedantic -Wshadow -Werror"
          cc $flags -Wl,-rpath,/tmp/ifs-ext2-ci \
            tests/ext2_external_interop.c /tmp/ifs-ext2-ci/EXT2.so \
            -o /tmp/ifs-ext2-ci/ext2-external
          bash tests/ext2_independent_roundtrip.sh /tmp/ifs-ext2-ci/ext2-external
