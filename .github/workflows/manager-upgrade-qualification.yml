# SPDX-License-Identifier: GPL-3.0-or-later
name: Qualify Filesystems manager Debian upgrade
on:
  push:
    branches: [main]
    paths:
      - "CMakeLists.txt"
      - "VERSION"
      - "src/**"
      - "packaging/**"
      - "data/org.infiltrator.Filesystems.desktop"
      - "tests/manager_upgrade_acceptance.py"
      - ".github/workflows/manager-upgrade-qualification.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  upgrade-0-5-110-to-0-5-116:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          submodules: recursive
      - name: Install test and manager build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build pkg-config libgtk-3-dev libudisks2-0 gnome-disk-utility policykit-1 mokutil kmod xvfb curl binutils
      - name: Build manager Debian package without publication
        run: |
          set -euo pipefail
          cmake -S . -B build-upgrade -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          cmake --build build-upgrade --target filesystems filesystems-package-removal-guard
          cpack -G DEB --config build-upgrade/CPackConfig.cmake -B dist-upgrade
          test -s dist-upgrade/Filesystems-0.5.116-amd64.deb
      - name: Test actual Debian upgrade, ownership, and GUI launcher in isolation
        run: |
          python3 tests/manager_upgrade_acceptance.py dist-upgrade/Filesystems-0.5.116-amd64.deb
      - name: Retain qualified manager package as CI artifact (not a release)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Filesystems-0.5.116-upgrade-candidate
          path: dist-upgrade/Filesystems-0.5.116-amd64.deb
          if-no-files-found: error
          retention-days: 14
