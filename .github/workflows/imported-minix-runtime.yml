name: Imported Minix native driver runtime

# This is an independent out-of-tree VFS qualification, not an installation.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/imported-minix-runtime.yml"
      - "native/filesystems/minix/linux/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  minix-qemu-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout original editable Minix driver
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Install tools for real disposable filesystem qualification
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libelf-dev libssl-dev \
            qemu-system-x86 busybox-static cpio util-linux

      - name: Compile Linux 6.12 kernel with Minix excluded
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v6.12.107 \
            https://github.com/gregkh/linux.git /tmp/linux-minix
          make -C /tmp/linux-minix defconfig
          /tmp/linux-minix/scripts/config --file /tmp/linux-minix/.config \
            --disable MINIX_FS \
            --enable BLK_DEV_INITRD \
            --enable DEVTMPFS \
            --enable DEVTMPFS_MOUNT \
            --enable VIRTIO \
            --enable VIRTIO_PCI \
            --enable VIRTIO_BLK \
            --enable SERIAL_8250 \
            --enable SERIAL_8250_CONSOLE \
            --enable TMPFS
          make -C /tmp/linux-minix olddefconfig
          make -C /tmp/linux-minix -j"$(nproc)" bzImage modules
          test -s /tmp/linux-minix/Module.symvers

      - name: Build the ORIGINAL Minix code as a separate actual .ko
        shell: bash
        run: |
          set -euo pipefail
          make -C /tmp/linux-minix \
            M="$PWD/native/filesystems/minix/linux" \
            CONFIG_MINIX_FS=m modules
          test -s native/filesystems/minix/linux/minix.ko
          test -s /tmp/linux-minix/arch/x86/boot/bzImage

      - name: Format independent Minix V3 test media
        shell: bash
        run: |
          set -euo pipefail
          truncate -s 32M /tmp/minix-volume.img
          mkfs.minix -3 /tmp/minix-volume.img

      - name: Build initramfs with only the external Minix driver
        shell: bash
        run: |
          set -euo pipefail
          root=/tmp/minix-qualification-root
          mkdir -p "$root"/{bin,proc,sys,dev,mnt}
          cp /usr/bin/busybox "$root/bin/busybox"
          for app in sh mount umount mkdir cat echo dd mv sync poweroff stat test grep ls; do
            ln -s busybox "$root/bin/$app"
          done
          cp native/filesystems/minix/linux/minix.ko "$root/minix.ko"
          cat > "$root/init" <<'EOF'
          #!/bin/sh
          set -eu
          fail() {
            echo "MINIX-RUNTIME-FAIL: $*" > /dev/ttyS0
            poweroff -f
            exit 1
          }
          mount -t proc proc /proc || fail proc
          mount -t sysfs sysfs /sys || fail sysfs
          mount -t devtmpfs devtmpfs /dev || fail devtmpfs
          insmod /minix.ko || fail "insmod original minix.ko"
          grep -q '[[:space:]]minix$' /proc/filesystems ||
            fail "native Minix registration"
          mount -t minix /dev/vda /mnt || fail "mount Minix V3"
          echo "independent original Minix KO runtime" > /mnt/payload.txt ||
            fail write
          mkdir /mnt/tree || fail mkdir
          dd if=/dev/zero of=/mnt/tree/data.bin bs=4096 count=8 ||
            fail payload
          mv /mnt/payload.txt /mnt/renamed.txt || fail rename
          sync
          umount /mnt || fail unmount
          mount -t minix /dev/vda /mnt || fail remount
          test "$(cat /mnt/renamed.txt)" = "independent original Minix KO runtime" ||
            fail "persistent file contents"
          test "$(stat -c %s /mnt/tree/data.bin)" = "32768" ||
            fail "persistent payload size"
          umount /mnt || fail "final unmount"
          echo "MINIX-RUNTIME-PASS" > /dev/ttyS0
          poweroff -f
          EOF
          chmod +x "$root/init"
          (cd "$root" && find . -print0 | cpio --null -ov --format=newc | gzip -9) \
            > /tmp/minix-qualification.cpio.gz

      - name: Boot actual Minix module and verify remount persistence
        shell: bash
        run: |
          set -euo pipefail
          timeout 180 qemu-system-x86_64 \
            -machine accel=tcg -m 768 -nographic -no-reboot \
            -kernel /tmp/linux-minix/arch/x86/boot/bzImage \
            -initrd /tmp/minix-qualification.cpio.gz \
            -append 'console=ttyS0 panic=1 rdinit=/init' \
            -drive file=/tmp/minix-volume.img,format=raw,if=virtio \
            2>&1 | tee /tmp/minix-qualification.log
          grep -Fq 'MINIX-RUNTIME-PASS' /tmp/minix-qualification.log
          ! grep -Fq 'MINIX-RUNTIME-FAIL' /tmp/minix-qualification.log
