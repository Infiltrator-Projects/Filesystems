name: Guard InfiltratorFS firmware ownership
on:
  push:
    paths:
      - 'firmware/uefi/**'
      - 'docs/BOOTABLE_FILESYSTEM_CONTRACT.md'
      - '.github/workflows/infiltratorfs-ownership.yml'
  pull_request:
    paths:
      - 'firmware/uefi/**'
      - 'docs/BOOTABLE_FILESYSTEM_CONTRACT.md'
      - '.github/workflows/infiltratorfs-ownership.yml'
permissions:
  contents: read
jobs:
  ownership:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Reject obsolete 0.18 implementation and verify maintained drivers remain
        shell: bash
        run: |
          set -euo pipefail
          test ! -e firmware/uefi/filesystems/fsw_infiltratorfs.c
          test ! -e firmware/uefi/filesystems/fsw_infiltratorfs.h
          test ! -e firmware/uefi/filesystems/infiltratorfs
          ! grep -Fq 'infiltratorfs_gnuefi:' firmware/uefi/filesystems/Makefile
          ! grep -Fq 'ifeq ($(DRIVERNAME),infiltratorfs)' firmware/uefi/filesystems/Make.gnuefi
          test -f firmware/uefi/filesystems/fsw_ext4.c
          test -f firmware/uefi/filesystems/fsw_hfs.c
          test -f native/filesystems/ofs/efi/reader.c
          test -f scripts/build-efi-drivers.sh
