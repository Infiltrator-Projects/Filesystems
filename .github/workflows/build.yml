name: Verify remaining unextracted Filesystems source
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  extraction-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          submodules: recursive
      - name: Require independent filesystem ownership
        run: |
          set -euo pipefail
          bash tools/validate-source-contract.sh
          python3 tests/repository_architecture_test.py .
          python3 tests/retired_helper_boundary_test.py .
      - name: Confirm legacy central binaries and publisher are retired
        run: |
          set -euo pipefail
          test ! -e .github/workflows/apt-publication.yml
          test ! -e native/providers
          ! grep -Fq "native/filesystems/fat/" CMakeLists.txt
  independent-fat-package-install-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Test pinned FAT12 FAT16 FAT32 release isolation in private dpkg root
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl binutils dpkg
          python3 tests/independent_fat_package_test.py
  independent-package-install-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Check pinned FFS and exFAT packages in isolated dpkg root
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl binutils dpkg
          python3 tests/independent_release_package_test.py
  temporary-manager-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          submodules: recursive
      - name: Install remaining manager prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build pkg-config libgtk-3-dev libudisks2-0
      - name: Configure and compile remaining code only
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build build --target filesystems filesystems-catalog-test filesystems-action-policy-test filesystems-desktop-actions-test filesystems-independent-package-test
          ctest --test-dir build --output-on-failure -R filesystems-catalog
          ctest --test-dir build --output-on-failure -R filesystems-action-policy
          ctest --test-dir build --output-on-failure -R filesystems-desktop-actions
          ctest --test-dir build --output-on-failure -R filesystems-independent-package
