name: Qualify imported Linux driver build baselines

# This deliberately builds ORIGINAL imported code before changing its internals.
# Nothing here updates data/native-filesystems.tsv, packages or live devices.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/imported-linux-driver-probe.yml"
      - "native/filesystems/**/linux/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-imported-linux-6-12:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout editable original Filesystems source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Prepare pinned Linux 6.12.107 module build interface
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bc bison flex libelf-dev libssl-dev
          kernel_tree="$RUNNER_TEMP/linux-6.12.107"
          echo "KERNEL_TREE=$kernel_tree" >> "$GITHUB_ENV"
          git clone --filter=blob:none --depth 1 --branch v6.12.107 \
            https://github.com/gregkh/linux.git "$kernel_tree"
          make -C "$kernel_tree" defconfig
          make -C "$kernel_tree" modules_prepare

      - name: Build all eight imported legacy modules and report exact failures
        shell: bash
        run: |
          set -euo pipefail
          # Use each original Kbuild's CONFIG gate: no source rewrite, no
          # substitution with the stock kernel's built-in filesystem.
          # CONFIG flags here select an out-of-tree *build*, not live loading.
          declare -A config=(
            [adfs]=CONFIG_ADFS_FS
            [bfs]=CONFIG_BFS_FS
            [efs]=CONFIG_EFS_FS
            [minix]=CONFIG_MINIX_FS
            [omfs]=CONFIG_OMFS_FS
            [qnx4]=CONFIG_QNX4FS_FS
            [qnx6]=CONFIG_QNX6FS_FS
            [sysv]=CONFIG_SYSV_FS
          )
          count=0
          failures=0
          for filesystem in adfs bfs efs minix omfs qnx4 qnx6 sysv; do
            directory="$GITHUB_WORKSPACE/native/filesystems/$filesystem/linux"
            log="$RUNNER_TEMP/$filesystem-build.log"
            printf '\n=== ORIGINAL SOURCE BUILD: %s ===\n' "$filesystem"
            # modules_prepare does not produce Module.symvers. Permit the
            # temporary modpost symbol-resolution warnings ONLY in this
            # early compilation probe, not in future qualification gates.
            if make -C "$KERNEL_TREE" M="$directory" \
                  "${config[$filesystem]}=m" \
                  KBUILD_MODPOST_WARN=1 modules > "$log" 2>&1 &&
               test -s "$directory/$filesystem.ko"; then
              echo "COMPILED: $filesystem"
              count=$((count + 1))
            else
              echo "::error title=Linux module build failed::$filesystem did not compile as an out-of-tree module"
              failures=$((failures + 1))
              tail -n 100 "$log" || true
            fi
            if grep -Eq 'section mismatch|WARNING: modpost: .*undefined' "$log"; then
              echo "::warning title=Kernel linking needs qualification::$filesystem has modpost warnings; compilation alone is not runtime qualification"
              grep -E 'section mismatch|WARNING: modpost: .*undefined' "$log" | head -n 12 || true
            fi
            echo "$filesystem: source compilation $([[ -s "$directory/$filesystem.ko" ]] && echo present || echo absent)" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "Compiled $count of 8 original source candidates; failures $failures" >> "$GITHUB_STEP_SUMMARY"
          test "$failures" -eq 0

  debian-6-12-symbol-qualified:
    # Debian's packaged kernel headers contain Module.symvers. This is a
    # genuine modpost link check, unlike the source-only kernel tree above.
    runs-on: ubuntu-24.04
    container: debian:trixie
    timeout-minutes: 35
    steps:
      - name: Checkout original Linux drivers
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Install distribution kernel headers and build dependencies
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential linux-headers-amd64 kmod ca-certificates
          headers=$(find /usr/src -mindepth 1 -maxdepth 1 -type d \
            -name 'linux-headers-*-amd64' | sort -V | tail -n1)
          test -n "$headers"
          test -s "$headers/Module.symvers"
          echo "DEBIAN_HEADERS=$headers" >> "$GITHUB_ENV"

      - name: Resolve actual exported symbols for eight original drivers
        shell: bash
        run: |
          set -euo pipefail
          declare -A config=(
            [adfs]=CONFIG_ADFS_FS
            [bfs]=CONFIG_BFS_FS
            [efs]=CONFIG_EFS_FS
            [minix]=CONFIG_MINIX_FS
            [omfs]=CONFIG_OMFS_FS
            [qnx4]=CONFIG_QNX4FS_FS
            [qnx6]=CONFIG_QNX6FS_FS
            [sysv]=CONFIG_SYSV_FS
          )
          failures=0
          count=0
          for filesystem in adfs bfs efs minix omfs qnx4 qnx6 sysv; do
            directory="$GITHUB_WORKSPACE/native/filesystems/$filesystem/linux"
            log="$RUNNER_TEMP/$filesystem-debian-build.log"
            echo "=== DEBIAN REAL SYMBOL BUILD: $filesystem ==="
            if make -C "$DEBIAN_HEADERS" M="$directory" \
                 "${config[$filesystem]}=m" modules >"$log" 2>&1 &&
               test -s "$directory/$filesystem.ko" &&
               [[ $(modinfo -F name "$directory/$filesystem.ko") == "$filesystem" ]]; then
              echo "SYMBOL-RESOLVED: $filesystem"
              count=$((count + 1))
            else
              echo "::error title=Module symbols unresolved::$filesystem cannot yet link against distribution exports"
              failures=$((failures + 1))
              tail -n 80 "$log" || true
            fi
            printf '%s: %s\n' "$filesystem" \
              "$([[ -s "$directory/$filesystem.ko" ]] && echo 'created (symbol link gate applies)' || echo 'not created')" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "Debian symbol-resolved modules: $count / 8" >> "$GITHUB_STEP_SUMMARY"
          test "$failures" -eq 0

  remaining-imported-symbol-probe:
    # Exploratory per-format survey; unresolved drivers remain unqualified.
    # This job has no path to package deployment and must not be interpreted
    # as a successful runtime qualification for any filesystem.
    continue-on-error: true
    runs-on: ubuntu-24.04
    container: debian:trixie
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: consumer
            filesystems: "apfs befs exfat fat hfs hfsplus hpfs ntfs udf ufs"
          - group: journaling
            filesystems: "btrfs f2fs jfs nilfs2 reiserfs"
          - group: cluster
            filesystems: "gfs2 ocfs2"
          - group: large
            filesystems: "bcachefs xfs"
    steps:
      - name: Checkout original, editable filesystem source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Get Debian 13 exported kernel interfaces
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential linux-headers-amd64 kmod ca-certificates
          headers=$(find /usr/src -mindepth 1 -maxdepth 1 -type d \
            -name 'linux-headers-*-amd64' | sort -V | tail -n1)
          test -n "$headers"
          test -s "$headers/Module.symvers"
          echo "DEBIAN_HEADERS=$headers" >> "$GITHUB_ENV"

      - name: Survey real symbol-resolved Linux driver builds
        shell: bash
        env:
          FILESYSTEM_LIST: ${{ matrix.filesystems }}
          GROUP_NAME: ${{ matrix.group }}
        run: |
          set -euo pipefail
          declare -A config=(
            [apfs]=APFS_ALREADY_OUT_OF_TREE
            [befs]=CONFIG_BEFS_FS
            [exfat]=CONFIG_EXFAT_FS
            [fat]=CONFIG_FAT_FS
            [hfs]=CONFIG_HFS_FS
            [hfsplus]=CONFIG_HFSPLUS_FS
            [hpfs]=CONFIG_HPFS_FS
            [ntfs]=CONFIG_NTFS3_FS
            [udf]=CONFIG_UDF_FS
            [ufs]=CONFIG_UFS_FS
            [btrfs]=CONFIG_BTRFS_FS
            [f2fs]=CONFIG_F2FS_FS
            [jfs]=CONFIG_JFS_FS
            [nilfs2]=CONFIG_NILFS2_FS
            [reiserfs]=CONFIG_REISERFS_FS
            [gfs2]=CONFIG_GFS2_FS
            [ocfs2]=CONFIG_OCFS2_FS
            [bcachefs]=CONFIG_BCACHEFS_FS
            [xfs]=CONFIG_XFS_FS
          )
          errors=0
          passed=0
          for filesystem in $FILESYSTEM_LIST; do
            directory="$GITHUB_WORKSPACE/native/filesystems/$filesystem/linux"
            log="$RUNNER_TEMP/$GROUP_NAME-$filesystem.log"
            name="$filesystem"
            extra=()
            case "$filesystem" in
              apfs)
                # Upstream DKMS PRE_BUILD generates this required version.h;
                # its source files and build flags are otherwise unchanged.
                (cd "$directory" && sh ./genver.sh)
                ;;
              fat)
                extra=(CONFIG_FAT_FS=m CONFIG_VFAT_FS=m CONFIG_MSDOS_FS=m)
                ;;
              ntfs)
                name=ntfs3
                extra=("${config[$filesystem]}=m")
                ;;
              *)
                extra=("${config[$filesystem]}=m")
                ;;
            esac
            if make -C "$DEBIAN_HEADERS" M="$directory" \
                 "${extra[@]}" modules >"$log" 2>&1 &&
               test -s "$directory/$name.ko" &&
               [[ $(modinfo -F name "$directory/$name.ko") == "$name" ]]; then
              if [[ "$filesystem" == fat ]]; then
                test -s "$directory/vfat.ko" && test -s "$directory/msdos.ko" || {
                  echo "::error title=FAT family incomplete::vfat/msdos modules missing"
                  errors=$((errors + 1))
                  continue
                }
              fi
              echo "SYMBOL-RESOLVED: $filesystem ($name)"
              echo "$filesystem: exported-symbol link PASS" >> "$GITHUB_STEP_SUMMARY"
              passed=$((passed + 1))
            else
              echo "::warning title=Driver needs porting::$filesystem failed strict distribution module build"
              echo "$filesystem: source present, exported-symbol link FAILED" >> "$GITHUB_STEP_SUMMARY"
              tail -n 70 "$log" || true
              errors=$((errors + 1))
            fi
          done
          echo "Group $GROUP_NAME: $passed passed, $errors need repair" >> "$GITHUB_STEP_SUMMARY"
          test "$errors" -eq 0
