name: Qualify original NTFS3 native Linux runtime

# Tests the actual original NTFS3 Linux driver from the single NTFS format tree.
# The independent NTFS-3G userspace tools create and inspect disposable media;
# they are NOT the runtime mount provider in the QEMU guest.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/imported-ntfs-runtime.yml"
      - "native/filesystems/ntfs/linux/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-ntfs3-qemu:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Check out exact original NTFS implementation
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Install kernel, QEMU and independent NTFS media tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libelf-dev libssl-dev \
            qemu-system-x86 busybox-static cpio ntfs-3g

      - name: Build Linux 6.12 without NTFS3 built into the kernel image
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --depth 1 --branch v6.12.107 \
            https://github.com/gregkh/linux.git /tmp/linux-ntfs3
          make -C /tmp/linux-ntfs3 defconfig
          /tmp/linux-ntfs3/scripts/config --file /tmp/linux-ntfs3/.config \
            --module NTFS3_FS \
            --disable NTFS3_LZX_XPRESS \
            --enable BLK_DEV_INITRD \
            --enable DEVTMPFS \
            --enable DEVTMPFS_MOUNT \
            --enable VIRTIO \
            --enable VIRTIO_PCI \
            --enable VIRTIO_BLK \
            --enable SERIAL_8250 \
            --enable SERIAL_8250_CONSOLE \
            --enable TMPFS
          make -C /tmp/linux-ntfs3 olddefconfig
          grep -Fxq 'CONFIG_NTFS3_FS=m' /tmp/linux-ntfs3/.config
          make -C /tmp/linux-ntfs3 -j"$(nproc)" bzImage modules
          test -s /tmp/linux-ntfs3/Module.symvers

      - name: Build independent original ntfs3.ko against the target kernel
        shell: bash
        run: |
          set -euo pipefail
          make -C /tmp/linux-ntfs3 \
            M="$PWD/native/filesystems/ntfs/linux" \
            CONFIG_NTFS3_FS=m modules
          test -s native/filesystems/ntfs/linux/ntfs3.ko
          test "$(modinfo -F name native/filesystems/ntfs/linux/ntfs3.ko)" = ntfs3
          test -s /tmp/linux-ntfs3/arch/x86/boot/bzImage

      - name: Create independently formatted disposable NTFS3-compatible media
        shell: bash
        run: |
          set -euo pipefail
          truncate -s 128M /tmp/ntfs-qualification.img
          mkfs.ntfs -F -Q -L FSQUAL /tmp/ntfs-qualification.img

      - name: Pack only the copied NTFS3 driver into the guest
        shell: bash
        run: |
          set -euo pipefail
          root=/tmp/ntfs-qualification-root
          mkdir -p "$root"/{bin,proc,sys,dev,mnt/ntfs}
          cp /usr/bin/busybox "$root/bin/busybox"
          for app in sh mount umount mkdir cat echo dd mv sync poweroff stat test grep ls; do
            ln -s busybox "$root/bin/$app"
          done
          cp native/filesystems/ntfs/linux/ntfs3.ko "$root/ntfs3.ko"
          cat > "$root/init" <<'EOF'
          #!/bin/sh
          set -eu
          fail() {
            echo "NTFS3-RUNTIME-FAIL: $*" > /dev/ttyS0
            poweroff -f
            exit 1
          }
          mount -t proc proc /proc || fail proc
          mount -t sysfs sysfs /sys || fail sysfs
          mount -t devtmpfs devtmpfs /dev || fail devtmpfs
          if grep -q '[[:space:]]ntfs3$' /proc/filesystems; then
            fail "unexpected built-in NTFS3 provider"
          fi
          insmod /ntfs3.ko || fail "load original ntfs3.ko"
          grep -q '[[:space:]]ntfs3$' /proc/filesystems ||
            fail "register NTFS3"
          mount -t ntfs3 /dev/vda /mnt/ntfs || fail "mount NTFS3"
          mkdir /mnt/ntfs/tree || fail mkdir
          echo "independent original NTFS3 driver" > /mnt/ntfs/tree/message.txt ||
            fail "create payload"
          dd if=/dev/zero of=/mnt/ntfs/tree/blocks.bin bs=4096 count=32 ||
            fail "write multi-cluster payload"
          mv /mnt/ntfs/tree/message.txt /mnt/ntfs/tree/renamed.txt ||
            fail rename
          sync
          umount /mnt/ntfs || fail unmount
          mount -t ntfs3 /dev/vda /mnt/ntfs || fail remount
          test "$(cat /mnt/ntfs/tree/renamed.txt)" = \
            "independent original NTFS3 driver" || fail "persistent contents"
          test "$(stat -c %s /mnt/ntfs/tree/blocks.bin)" = 131072 ||
            fail "persistent payload size"
          umount /mnt/ntfs || fail "final unmount"
          echo "NTFS3-RUNTIME-PASS" > /dev/ttyS0
          poweroff -f
          EOF
          chmod +x "$root/init"
          (cd "$root" && find . -print0 | cpio --null -ov --format=newc | gzip -9) \
            > /tmp/ntfs-qualification.cpio.gz

      - name: Verify native runtime and independent userspace readback
        shell: bash
        run: |
          set -euo pipefail
          timeout 180 qemu-system-x86_64 \
            -machine accel=tcg -m 768 -nographic -no-reboot \
            -kernel /tmp/linux-ntfs3/arch/x86/boot/bzImage \
            -initrd /tmp/ntfs-qualification.cpio.gz \
            -append 'console=ttyS0 panic=1 rdinit=/init' \
            -drive file=/tmp/ntfs-qualification.img,format=raw,if=virtio \
            2>&1 | tee /tmp/ntfs-qualification.log
          grep -Fq 'NTFS3-RUNTIME-PASS' /tmp/ntfs-qualification.log
          ! grep -Fq 'NTFS3-RUNTIME-FAIL' /tmp/ntfs-qualification.log
          ntfscat /tmp/ntfs-qualification.img /tree/renamed.txt |
            grep -Fxq 'independent original NTFS3 driver'
