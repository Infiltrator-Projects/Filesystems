name: Verify editable original filesystem sources
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-source-audit:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact Filesystems source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Verify original source remains available
        run: |
          set -euo pipefail
          test -s data/imported-source-filesystems.txt
          bash tools/validate-source-contract.sh
          python3 tests/repository_architecture_test.py .
