name: Independent freestanding filesystem shared objects
# One authoritative qualification, invoked by the release-gated build.
# workflow_dispatch remains available for isolated manual verification.
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-dropins:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact candidate source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Independently compile and exercise all seven implemented modules
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ifs-dropins
          flags="-std=c11 -O2 -Wall -Wextra -Wpedantic -Wshadow -Werror"
          moduleflags="-fPIC -fno-builtin -fno-stack-protector -ffreestanding -fvisibility=hidden -nostdlib -shared -Wl,-z,defs -Wl,-z,relro -Wl,-z,now"
          for width in 12 16 32; do
            src=native/filesystems/fat/module
            cc $flags $moduleflags -I "$src" "$src/fat${width}_module.c" -o "/tmp/ifs-dropins/FAT$width.so"
            cc $flags -I "$src" "tests/fat${width}_module_test.c" "$src/fat${width}_module.c" -o "/tmp/ifs-dropins/fat$width-test"
            "/tmp/ifs-dropins/fat$width-test"
          done
          src=native/filesystems/ofs
          cc $flags $moduleflags -I "$src/module" -I "$src/core" -I "$src/efi" "$src/module/ofs_module.c" "$src/efi/reader.c" "$src/core/ofs_core.c" "$src/core/ofs_primitives.c" -o /tmp/ifs-dropins/OFS.so
          cc $flags -I "$src/module" -I "$src/core" -I "$src/efi" tests/ofs_dropin_module_test.c "$src/module/ofs_module.c" "$src/efi/reader.c" "$src/core/ofs_core.c" "$src/core/ofs_primitives.c" -o /tmp/ifs-dropins/ofs-test
          /tmp/ifs-dropins/ofs-test
          src=native/filesystems/ext2
          cc $flags $moduleflags -I "$src/module" -I "$src/core" "$src/module/ext2_module.c" "$src/core/ext2_core.c" "$src/core/ext2_engine.c" -o /tmp/ifs-dropins/EXT2.so
          cc $flags -I "$src/module" -I "$src/core" tests/ext2_dropin_module_test.c "$src/module/ext2_module.c" "$src/core/ext2_core.c" "$src/core/ext2_engine.c" -o /tmp/ifs-dropins/ext2-test
          /tmp/ifs-dropins/ext2-test
          src=native/filesystems/bfs/module
          cc $flags $moduleflags -I "$src" "$src/bfs_module.c" -o /tmp/ifs-dropins/BFS.so
          cc $flags -I "$src" tests/bfs_dropin_module_test.c "$src/bfs_module.c" -o /tmp/ifs-dropins/bfs-test
          /tmp/ifs-dropins/bfs-test
          src=native/filesystems/minix/module
          cc $flags $moduleflags -I "$src" "$src/minix_module.c" -o /tmp/ifs-dropins/MINIX.so
          cc $flags -I "$src" tests/minix_dropin_module_test.c "$src/minix_module.c" -o /tmp/ifs-dropins/minix-test
          /tmp/ifs-dropins/minix-test
      - name: Check ELF identity, ABI exports and freestanding linkage
        shell: bash
        run: |
          set -euo pipefail
          for fs in FAT12 FAT16 FAT32 OFS EXT2 BFS MINIX; do
            file="/tmp/ifs-dropins/$fs.so"
            test -s "$file"
            readelf -h "$file" | grep -Eq 'Type:.*DYN'
            readelf -Ws "$file" | grep -F 'infiltrator_filesystem_module_v1' >/dev/null
            identity=$(printf '%s' "$fs" | tr '[:upper:]' '[:lower:]')
            readelf -p .ifsmeta "$file" | grep -F "IFS-MODULE:$identity:1" >/dev/null
            if readelf -d "$file" | grep -Eq '[(]NEEDED[)]'; then
              echo "Forbidden shared-library dependency: $fs.so" >&2
              exit 1
            fi
          done
          # V2 must remain a genuine, separately exported, format-identified
          # FAT extension. Existing V1 entry points must remain present.
          for fs in FAT12 FAT16 FAT32; do
            file="/tmp/ifs-dropins/$fs.so"
            identity=$(printf '%s' "$fs" | tr '[:upper:]' '[:lower:]')
            readelf -Ws "$file" | grep -F 'infiltrator_filesystem_module_v2' >/dev/null
            readelf -p .ifsmeta "$file" | grep -F "IFS-MODULE:$identity:2" >/dev/null
          done
          for helper in fat12 fat16 fat32 ofs ext2 bfs minix; do
            bash -n "packaging/linux/$helper-module-helper.sh"
          done
          sha256sum /tmp/ifs-dropins/*.so
          echo SEVEN-INDEPENDENT-DROPINS-FAT-V2-PASSED
