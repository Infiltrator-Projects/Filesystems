name: Independent freestanding filesystem shared objects
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/dropin-modules.yml"
      - ".gitmodules"
      - "native/providers/**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-dropins:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out pinned independently owned sources
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          submodules: recursive
      - name: Build and test each canonical provider
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential binutils python3
          for fs in FAT12 FAT16 FAT32 OFS; do
            root="native/providers/Filesystem-$fs"
            test -f "$root/Makefile"
            make -C "$root" check
            lib="$root/build/$fs.so"
            test -s "$lib"
            readelf -h "$lib" | grep -Eq 'Type:.*DYN'
            readelf -Ws "$lib" | grep -F 'infiltrator_filesystem_module_v1' >/dev/null
            identity=$(printf '%s' "$fs" | tr '[:upper:]' '[:lower:]')
            readelf -p .ifsmeta "$lib" | grep -F "IFS-MODULE:$identity:1" >/dev/null
            if readelf -d "$lib" | grep -Eq '[(]NEEDED[)]'; then
              echo "Forbidden runtime shared-library dependency: $fs.so" >&2
              exit 1
            fi
            sha256sum "$lib"
          done
          echo FOUR-INDEPENDENT-SOURCE-OWNERS-QUALIFIED
