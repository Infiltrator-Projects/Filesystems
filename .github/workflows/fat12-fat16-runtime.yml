name: FAT12/FAT16 actual driver runtime qualification
on:
  pull_request:
    paths:
      - 'native/filesystems/fat/**'
      - 'scripts/test-fat-uefi-ovmf.sh'
      - 'tests/fat_uefi_rw_probe.c'
      - 'tests/fat_kernel_runtime_init.sh'
      - '.github/workflows/fat12-fat16-runtime.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  uefi-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Install build and isolated firmware test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential nasm uuid-dev acpica-tools python3 python3-setuptools gnu-efi binutils qemu-system-x86 ovmf dosfstools mtools gdisk
      - name: Build the actual FAT12 and FAT16 EFI drivers
        run: bash scripts/build-fat12-fat16-efi.sh
      - name: Exercise exact driver bindings against independent writable media
        run: bash scripts/test-fat-uefi-ovmf.sh
      - name: Retain firmware logs on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fat-uefi-runtime-logs
          path: ${{ runner.temp }}/fat-efi-qualification/**/serial.log
          if-no-files-found: ignore
  linux-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Install kernel, QEMU and independent FAT media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bc bison flex libelf-dev libssl-dev qemu-system-x86 busybox-static cpio dosfstools mtools kmod
      - name: Build pinned kernel with FAT core built in and no vfat namespace
        shell: bash
        run: |
          set -euo pipefail
          kernel="$RUNNER_TEMP/linux-fat"
          # v6.12.107 resolves to this exact upstream commit. An archive avoids
          # repeated rate-limited smart-HTTP clones of the full Linux tree.
          commit=f717995cb7dcd8998ab15516b8006aea09cfde0d
          curl --fail --location --retry 5 --retry-delay 4 --retry-all-errors \
            --connect-timeout 30 --max-time 600 \
            "https://codeload.github.com/gregkh/linux/tar.gz/$commit" \
            --output "$RUNNER_TEMP/linux-fat.tar.gz"
          mkdir -p "$kernel"
          tar -xzf "$RUNNER_TEMP/linux-fat.tar.gz" -C "$kernel" --strip-components=1
          test -f "$kernel/Makefile"
          make -C "$kernel" defconfig
          "$kernel/scripts/config" --file "$kernel/.config" \
            --enable MSDOS_FS --disable VFAT_FS --enable NLS --enable NLS_CODEPAGE_437 \
            --enable NLS_ISO8859_1 --enable BLK_DEV_INITRD --enable DEVTMPFS \
            --enable DEVTMPFS_MOUNT --enable VIRTIO --enable VIRTIO_PCI \
            --enable VIRTIO_BLK --enable SERIAL_8250 --enable SERIAL_8250_CONSOLE --enable TMPFS
          make -C "$kernel" olddefconfig
          grep -Fxq 'CONFIG_FAT_FS=y' "$kernel/.config"
          grep -Fxq 'CONFIG_MSDOS_FS=y' "$kernel/.config"
          grep -Fxq '# CONFIG_VFAT_FS is not set' "$kernel/.config"
          make -C "$kernel" -j"$(nproc)" bzImage modules
          test -s "$kernel/Module.symvers"
      - name: Build the actual two Linux namespace modules
        shell: bash
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/fat-variants"
          mkdir -p "$stage"
          cp -a native/filesystems/fat/linux/. "$stage/"
          cp "$stage/Makefile.variants" "$stage/Makefile"
          make -C "$RUNNER_TEMP/linux-fat" M="$stage" modules
          test "$(modinfo -F name "$stage/fat12.ko")" = fat12
          test "$(modinfo -F name "$stage/fat16.ko")" = fat16
      - name: Create independent images and isolated initramfs
        shell: bash
        run: |
          set -euo pipefail
          truncate -s 1440K "$RUNNER_TEMP/fat12.img"
          truncate -s 8M "$RUNNER_TEMP/fat16.img"
          truncate -s 64M "$RUNNER_TEMP/fat32.img"
          mkfs.fat -F 12 -I "$RUNNER_TEMP/fat12.img"
          mkfs.fat -F 16 -I -s 1 "$RUNNER_TEMP/fat16.img"
          mkfs.fat -F 32 -I -s 1 "$RUNNER_TEMP/fat32.img"
          root="$RUNNER_TEMP/fat-initramfs"
          mkdir -p "$root"/{bin,proc,sys,dev,mnt/test}
          cp /usr/bin/busybox "$root/bin/busybox"
          for app in sh mount umount mkdir cat echo dd mv sync poweroff stat test grep ls insmod sha256sum rm rmdir; do
            ln -s busybox "$root/bin/$app"
          done
          cp "$RUNNER_TEMP/fat-variants/"fat{12,16}.ko "$root/"
          cp tests/fat_kernel_runtime_init.sh "$root/init"
          chmod +x "$root/init"
          (cd "$root" && find . -print0 | cpio --null -ov --format=newc | gzip -9) > "$RUNNER_TEMP/fat-initramfs.cpio.gz"
      - name: Boot our modules and check external filesystem consistency
        shell: bash
        run: |
          set -euo pipefail
          timeout 180 qemu-system-x86_64 -machine accel=tcg -m 768 -nographic -no-reboot \
            -kernel "$RUNNER_TEMP/linux-fat/arch/x86/boot/bzImage" \
            -initrd "$RUNNER_TEMP/fat-initramfs.cpio.gz" \
            -append 'console=ttyS0 panic=1 rdinit=/init' \
            -drive "file=$RUNNER_TEMP/fat12.img,format=raw,if=virtio" \
            -drive "file=$RUNNER_TEMP/fat16.img,format=raw,if=virtio" \
            -drive "file=$RUNNER_TEMP/fat32.img,format=raw,if=virtio" \
            2>&1 | tee "$RUNNER_TEMP/fat-kernel-serial.log"
          grep -Fq 'FAT-KO-RUNTIME-PASS: fat12' "$RUNNER_TEMP/fat-kernel-serial.log"
          grep -Fq 'FAT-KO-RUNTIME-PASS: fat16' "$RUNNER_TEMP/fat-kernel-serial.log"
          ! grep -Fq 'FAT-KO-RUNTIME-FAIL' "$RUNNER_TEMP/fat-kernel-serial.log"
          fsck.fat -n "$RUNNER_TEMP/fat32.img"
          for bits in 12 16; do
            fsck.fat -n "$RUNNER_TEMP/fat$bits.img"
            mcopy -i "$RUNNER_TEMP/fat$bits.img" '::/tree/Renamed Long Name.txt' "$RUNNER_TEMP/fat$bits-readback.txt"
            test "$(cat "$RUNNER_TEMP/fat$bits-readback.txt")" = "fat$bits kernel driver survives remount"
            mcopy -i "$RUNNER_TEMP/fat$bits.img" '::/tree/blocks.bin' "$RUNNER_TEMP/fat$bits-blocks.bin"
            test "$(wc -c < "$RUNNER_TEMP/fat$bits-blocks.bin")" = 131072
          done
      - name: Retain kernel runtime log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fat-kernel-runtime-log
          path: ${{ runner.temp }}/fat-kernel-serial.log
          if-no-files-found: ignore
