# SPDX-License-Identifier: GPL-3.0-or-later
# Compile the actual Defragmenter worker entrypoints with the trusted
# Common V2 host; preserve historical V1 writers until verified parity.
name: Compile Defragmenter native filesystem V2 worker routes
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/defragmenter-v2-workers.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-owned-workers:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout reviewed Defragmenter source with Common
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Infiltrator-Projects/Defragmenter
          ref: 1fc58e94c09b58a6e1b9160e253a6a1070edc55f
          path: consumer
          submodules: recursive
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config \
            libgtk-3-dev libssl-dev libsqlite3-dev libext2fs-dev
      - name: Build production filesystem worker executables with warnings as errors
        run: |
          set -euo pipefail
          test "$(git -C consumer rev-parse HEAD)" = "1fc58e94c09b58a6e1b9160e253a6a1070edc55f"
          cmake -S consumer/defragger -B consumer/defragger/build \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DLD_ENABLE_WERROR=ON
          cmake --build consumer/defragger/build --parallel 2 --target \
            defragmenter-fat-worker \
            defragmenter-ext-worker \
            defragmenter-xfs-worker \
            defragmenter-btrfs-worker \
            defragmenter-minix-worker \
            defragmenter-apfs-worker \
            defragmenter-ntfs-worker \
            defragmenter-hfs-worker \
            defragmenter-hfsplus-worker \
            defragmenter-pfs3-worker \
            defragmenter-sfs-worker \
            defragmenter-exfat-worker \
            defragmenter-ofs-worker \
            defragmenter-affs-worker
      - name: Assert production V2 read-only routes and original writers coexist
        run: |
          set -euo pipefail
          for format in fat ext xfs btrfs minix apfs ntfs hfs hfsplus pfs3 sfs exfat ofs affs; do
            test -x "consumer/defragger/build/defragmenter-$format-worker"
          done
          for path in \
            consumer/defragger/native/fat_module_loader.c \
            consumer/defragger/native/ext_module_loader.c \
            consumer/defragger/native/xfs_module_loader.c \
            consumer/defragger/native/btrfs_module_loader.c \
            consumer/defragger/native/minix_module_loader.c \
            consumer/defragger/native/apfs_module_loader.c \
            consumer/defragger/native/ntfs_module_loader.c \
            consumer/defragger/native/hfs_module_loader.c \
            consumer/defragger/native/hfsplus_module_loader.c \
            consumer/defragger/native/pfs3_module_loader.c \
            consumer/defragger/native/sfs_module_loader.c \
            consumer/defragger/native/exfat_module_loader.c \
            consumer/defragger/native/ofs_module_loader.c \
            consumer/defragger/native/affs_module_loader.c
          do
            grep -Fq 'volume-info' "$path" || {
              echo "Missing Common V2 volume-info worker path: $path" >&2
              exit 1
            }
          done
          # Writer parity is a separate gate, not inferred by compilation.
          echo "COMMON-V2-READONLY-PRODUCTION-WORKERS-COMPILE-PASS"
